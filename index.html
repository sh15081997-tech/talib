// Всё выученное делится на N дней (по умолчанию 7): каждый день — своя порция.
function revGoal(){ const q=state.quran; if(q.revMode==='smart') return +q.revGoal||0; const P=quranTotals().pg; return P>0?r3(P/(q.cycleDays||7)):0; }
function juzOfAyah(s,a){ let j=1; for(const J of JUZ){ if(J.s<s||(J.s===s&&J.a<=a)) j=J.n; } return j; }
function cycleInfo(){
  const q=state.quran, N=q.cycleDays||7, t=today(), ord=q.revOrder||'asc';
  const portions=Array.from({length:N},()=>({segs:[],pg:0})), total=quranTotals().pg, per=total/N;
  // Выученное по джузам (в порядке повторения). Если джузов не меньше, чем дней круга, — режем по границам джузов
  // (7 джузов → по джузу в день, 14 → по два); иначе делим по аятам поровну.
  const juzUnits=[]; for(const J of (ord==='desc'?[...JUZ].reverse():JUZ)){ const segs=[]; let pg=0;
    for(const g of juzSegments(J.n)){ const S=SUR[g.s-1], m=memStr(g.s), pa=S.pages/S.ayahs; let cur=null;
      for(let a=g.from;a<=g.to;a++){ if(m.charCodeAt(a-1)===49){ if(cur&&cur.to===a-1) cur.to=a; else { cur={s:g.s,from:a,to:a}; segs.push(cur); } pg+=pa; } } }
    if(pg>0) juzUnits.push({segs,pg}); }
  if(total>0&&juzUnits.length>=N){ let acc=0;
    for(const U of juzUnits){ const i=Math.min(N-1,Math.floor((acc+U.pg/2)/per+1e-9)); portions[i].segs.push(...U.segs); portions[i].pg+=U.pg; acc+=U.pg; } }
  else if(total>0){ let acc=0;
    for(const S of (ord==='desc'?[...SUR].reverse():SUR)){ const m=memStr(S.n); if(m.indexOf('1')<0) continue; const pa=S.pages/S.ayahs;
      for(let a=1;a<=S.ayahs;a++){ if(m.charCodeAt(a-1)!==49) continue;
        const i=Math.min(N-1,Math.floor((acc+pa/2)/per+1e-9)), P=portions[i], L=P.segs[P.segs.length-1];
        if(L&&L.s===S.n&&L.to===a-1) L.to=a; else P.segs.push({s:S.n,from:a,to:a}); P.pg+=pa; acc+=pa; } } }
  const start=q.cycleStart||t, dd=Math.max(0,diffDays(start,t)), no=Math.floor(dd/N);
  return {N,portions,total,per,idx:dd%N,no,curStart:addDays(start,no*N)};
}
function portionLabel(P){
  if(!P.segs.length) return '—';
  // целые джузы — называем джузами
  const whole=JUZ.filter(J=>{ const js=juzSegments(J.n); return js.every(g=>P.segs.some(x=>x.s===g.s&&x.from<=g.from&&x.to>=g.to)); }).map(J=>J.n);
  if(whole.length){ const pgW=whole.reduce((a,j)=>a+juzStats(j).pg,0); if(Math.abs(pgW-P.pg)<0.6) return whole.length===1?`Джуз ${whole[0]}`:`Джузы ${whole.join(', ')}`; }
  const a=P.segs[0], b=P.segs[P.segs.length-1], A=SUR[a.s-1], B=SUR[b.s-1];
  const ja=juzOfAyah(a.s,a.from), jb=juzOfAyah(b.s,b.to);
  const one=(S,x,full,pos)=>`${S.n}. ${S.name}${full?'':' '+(pos==='a'?x.from:x.to)}`;
  if(P.segs.length===1&&a.from===1&&a.to===A.ayahs) return `${A.n}. ${A.name} · джуз ${ja}`;
  if(P.segs.length===1) return `${A.n}. ${A.name}, аяты ${a.from}–${a.to} · джуз ${ja}`;
  return `${one(A,a,a.from===1,'a')} → ${one(B,b,b.to===B.ayahs,'b')} · ${ja===jb?'джуз '+ja:'джузы '+ja+'–'+jb}`;
}

// Отмечает повторение набора отрезков: страницы в журнал, оценка сурам, закрывает порции круга
function applyRevSegs(segs,quality,date){
  const q=state.quran, cov={};
  for(const g of segs){ const m=memStr(g.s); for(let a=g.from;a<=g.to;a++) if(m.charCodeAt(a-1)===49){ (cov[g.s]=cov[g.s]||new Set()).add(a); } }
  let pages=0; for(const s in cov){ const S=SUR[s-1]; pages+=cov[s].size*S.pages/S.ayahs; }
  if(pages<=0) return 0;
  addLog('rev',date,pages);
  for(const s in cov){ if(cov[s].size===memCount(+s)){ q.rev[s]=srsNext(revRec(+s),quality,date); if(!q.lastRev[s]||q.lastRev[s]<date) q.lastRev[s]=date; } }
  if(q.revMode!=='smart'){ const C=cycleInfo(), d0=diffDays(C.curStart,date);
    if(d0>=0&&d0<C.N) C.portions.forEach((P,i)=>{ if(i>d0||q.cycleDone[cycKey(C.no,i)]||!P.segs.length) return;
      if(P.segs.every(g=>{ for(let a=g.from;a<=g.to;a++) if(!(cov[g.s]&&cov[g.s].has(a))) return false; return true; })) q.cycleDone[cycKey(C.no,i)]=date; }); }
  return pages;
}

function occurs(k,D){
  if(!k.rep) return k.date===D;
  const s=k.date||k.created||today(); if(D<s||(k.until&&D>k.until)) return false;
  const r=k.rep, w=dow(D);
  if(r.t==='day') return true; if(r.t==='wd') return w>=1&&w<=5;
  if(r.t==='week') return (r.days||[]).includes(w);
  if(r.t==='month'){ const sd=parseD(s).getDate(), dd=parseD(D), last=new Date(dd.getFullYear(),dd.getMonth()+1,0).getDate(); return dd.getDate()===Math.min(sd,last); }
  if(r.t==='n') return diffDays(s,D)%Math.max(1,r.n||2)===0;

function isDone(k,D){ return k.rep?!!(k.doneOn&&k.doneOn[D]):!!k.done; }
function tasksOn(D){ return state.tasks.filter(k=>occurs(k,D)).sort((a,b)=>(isDone(a,D)-isDone(b,D))||((a.time||'99')<(b.time||'99')?-1:(a.time||'99')>(b.time||'99')?1:0)||(b.prio||0)-(a.prio||0)); }

const soonDeadlines=()=>{ const t=today(), lim=addDays(t,14); return state.tasks.filter(k=>k.due&&!isDone(k,t)&&(!k.rep)&&k.due>=t&&k.due<=lim).sort((a,b)=>a.due<b.due?-1:1); };

const WD_FORMS=[['воскрес',0],['понедел',1],['вторн',2],['сред',3],['четвер',4],['пятниц',5],['суббот',6]];
const WD_SHORT={'пн':1,'вт':2,'ср':3,'чт':4,'пт':5,'сб':6,'вс':0};
function parseQuick(s,base){
  let t=' '+s+' ', date=base, time='', prio=0, due='', rep=null;
  const cut=re=>{ const m=t.match(re); if(m) t=t.replace(m[0],' '); return m; };
  let m;
  if(cut(/\s!!+(?=\s)/)) prio=2; else if(cut(/\s!(?=\s)/)) prio=1;
  if((m=cut(/\sдо\s+(\d{1,2})\.(\d{1,2})(?:\.(\d{2,4}))?(?=\s)/i))){ const y=m[3]?(m[3].length===2?2000+ +m[3]:+m[3]):parseD(base).getFullYear(); due=ds(new Date(y,+m[2]-1,+m[1])); if(!m[3]&&due<today()) due=ds(new Date(y+1,+m[2]-1,+m[1])); }
  else if(cut(/\sдо\s+завтра(?=\s)/i)) due=addDays(today(),1);
  if((m=cut(/\s(?:в\s+)?([01]?\d|2[0-3])[:.]([0-5]\d)(?=\s)/i))) time=m[1].padStart(2,'0')+':'+m[2];
  if(cut(/\s(каждый\s+день|ежедневно)(?=\s)/i)) rep={t:'day'};
  else if(cut(/\sпо\s+будням(?=\s)/i)) rep={t:'wd'};
  else if(cut(/\sпо\s+выходным(?=\s)/i)) rep={t:'week',days:[6,0]};
  else if(cut(/\s(каждый\s+месяц|ежемесячно)(?=\s)/i)) rep={t:'month'};
  else if(cut(/\sчерез\s+день(?=\s)/i)) rep={t:'n',n:2};
  else if((m=cut(/\sкаждые\s+(\d+)\s+д[а-я]*(?=\s)/i))) rep={t:'n',n:+m[1]};
  else if(cut(/\s(каждую\s+неделю|еженедельно)(?=\s)/i)) rep={t:'week',days:[dow(base)]};
  if(!rep){ // «по пн и чт», «по понедельникам, средам»
    const w=t.trim().split(/\s+/);
    const tok=x=>{ x=x.toLowerCase().replace(/[,.]$/,''); if(WD_SHORT[x]!=null) return WD_SHORT[x]; const f=WD_FORMS.find(z=>x.startsWith(z[0])); return f&&/(ам|ям)$/.test(x)?f[1]:null; };
    for(let i=0;i<w.length-1;i++){ if(w[i].toLowerCase()!=='по') continue; const days=[]; let j=i+1;
      for(;j<w.length;j++){ const x=w[j].toLowerCase(); if(x==='и'||x===',') continue; const d=tok(x); if(d==null) break; days.push(d); }
      if(days.length){ rep={t:'week',days:[...new Set(days)]}; w.splice(i,j-i); t=' '+w.join(' ')+' '; break; } } }
  if(cut(/\sпослезавтра(?=\s)/i)) date=addDays(today(),2);
  else if(cut(/\sзавтра(?=\s)/i)) date=addDays(today(),1);
  else if(cut(/\sсегодня(?=\s)/i)) date=today();
  else if((m=cut(/\s(?:в|во)\s+(понедельник|вторник|среду|четверг|пятницу|субботу|воскресенье)(?=\s)/i))){ const f=WD_FORMS.find(x=>m[1].toLowerCase().startsWith(x[0].slice(0,4))); if(f){ let d=addDays(today(),1); while(dow(d)!==f[1]) d=addDays(d,1); date=d; } }
  return {text:t.replace(/\s+/g,' ').trim(),date,time,prio,due,rep};
}

const HIJRI_EVENTS={'1-1':'Новый год по хиджре','1-10':'День Ашура','9-1':'Начало Рамадана','10-1':'Ид аль-Фитр (Ураза-байрам)','12-9':'День Арафа','12-10':'Ид аль-Адха (Курбан-байрам)'};
function calEvents(D){
  const ev=[], add=(cls,txt)=>ev.push({cls,txt});
  for(const it of state.items){ if(it.start===D) add('start','Начало: '+it.title); if(it.dlMode==='deadline'&&it.deadline===D&&!it.finished) add('due','Срок: '+it.title); if(it.finished===D) add('ok','Завершено: '+it.title); }
  for(const x of state.texts){ if(x.start===D) add('start','Начало: '+x.title); if(x.deadline===D) add('due','Срок: '+x.title); }
  if(state.khatm.deadline===D) add('due','Срок хатма №'+khN()); if(state.quran.deadline===D) add('due','Срок заучивания Корана');
  for(const g of state.quran.goals) if(g.deadline===D) add('due','Цель: '+goalName(g));
  for(const k of state.tasks) if(k.due===D&&!(k.rep)) add(k.done?'ok':'due','Срок задачи: '+k.text);
  const h=hijriParts(D), he=HIJRI_EVENTS[h.m+'-'+h.d]; if(he) add('isl',he);
  if(h.m===9&&[20,22,24,26,28].includes(h.d)) add('isl',`Вечером — ${h.d+1}-я ночь Рамадана`);
  return ev;
}

  return h+'</div>';
}

/* ===================== РАМАДАН ===================== */
let RAM_CACHE=null;
function ramadanRange(){
  const t=today(); if(RAM_CACHE&&RAM_CACHE.t===t) return RAM_CACHE.r;
  const find=(from)=>{ for(let i=0;i<420;i++){ const d=addDays(from,i), h=hijriParts(d); if(h.m===9&&h.d===1){ let end=addDays(d,28); for(let j=28;j<=31;j++){ const e=addDays(d,j), he=hijriParts(e); if(he.m===10&&he.d===1){ end=addDays(e,-1); break; } } return {start:d,end,year:h.y,days:diffDays(d,end)+1}; } } return null; };
  let r=find(addDays(t,-35)); if(r&&r.end<t) r=find(addDays(r.end,300));
  RAM_CACHE={t,r}; return r;
}
const ramYear=y=>(state.ramadan[y]=state.ramadan[y]||{});
const FAST_TXT={y:'держал пост',n:'не держал',e:'уважительная причина'};
const RAM_ITEMS=[['t','Таравих'],['q','Ночной намаз'],['s','Садака'],['d','Дуа и азкары'],['i','Накормил постящегося']];
function ramStats(R){ const Y=state.ramadan[R.year]||{}; let fast=0,miss=0,tar=0; for(let i=1;i<=R.days;i++){ const x=Y[i]||{}; if(x.f==='y') fast++; else if(x.f==='n'||x.f==='e') miss++; if(x.t) tar++; }
  const pages=sumR(state.khatm.log,R.start,R.end), khatms=state.khatm.done.filter(d=>d.end>=R.start&&d.end<=R.end).length; return {fast,miss,tar,pages,khatms}; }
function qadaOwed(){ let owed=0; for(const y in state.ramadan) for(const d in state.ramadan[y]){ const f=state.ramadan[y][d].f; if(f==='n'||f==='e') owed++; } return Math.max(0,owed-(state.qada.made||[]).length); }

    <div class="card"><h2>${ico('star2')}Последние десять ночей</h2><div class="hist" style="max-height:none">${[21,23,25,27,29].filter(n=>n<=R.days).map(n=>{ const night=addDays(R.start,n-2); return `<div><span><b>${n}-я ночь</b>${n===27?' <span class="pill ok">особо желанная</span>':''}</span><span class="sub">вечер ${fmtDs(night)} · ${WD[dow(night)]}</span></div>`; }).join('')}</div>

  return h+'</div>';

// План хатма на Рамадан, выбранный заранее, включается в первый день Рамадана
function applyRamPlan(){ const K=state.khatm, P=K.ramPlan, t=today(); if(!P||t<P.start) return; delete K.ramPlan; if(t>P.end) return save();
  const pages=TOTAL_PAGES-K.cur.page+(P.k-1)*TOTAL_PAGES; K.goal=Math.ceil(pages/Math.max(1,diffDays(t,P.end)+1)); K.deadline=P.end; save(); setTimeout(()=>toast(`Рамадан мубарак! Вирд на Рамадан: ${K.goal} стр. в день`),300); }
function sendWidget(){
  if(!ANDROID) return; const t=today(), q=state.quran, K=state.khatm, L=tasksOn(t), td=L.filter(k=>isDone(k,t)).length, rg=revGoal();
  const row=(l,v,g,u)=>({l,v:g>0?`${fmt(v)} / ${fmt(g)} ${u}`:`${fmt(v)} ${u}`,z:g>0?`0 / ${fmt(g)} ${u}`:`0 ${u}`,p:g>0?Math.min(100,Math.round(v/g*100)):(v>0?100:0)});
  const rows=[row('Заучивание',state.log.hifz[t]||0,q.goal,'стр.'),row('Повторение',state.log.rev[t]||0,rg,'стр.'),row('Чтение Корана',K.log[t]||0,K.goal,'стр.'),
    {l:'Задачи',v:L.length?`${td} / ${L.length}`:'нет задач',z:'—',p:L.length?Math.round(td/L.length*100):0}];
  const h=hijriParts(t), R=ramadanRange(), inR=R&&t>=R.start&&t<=R.end;

}

    const rt=$('#kRep').value; let rep=null;
    if(rt){ rep={t:rt}; if(rt==='week'){ rep.days=[...document.querySelectorAll('.kwd')].filter(c=>c.checked).map(c=>+c.dataset.i); if(!rep.days.length) return $('#kErr').textContent='Выберите дни недели.'; } if(rt==='n') rep.n=Math.max(2,parseInt($('#kN').value)||2); }
    const data={text,note:$('#kNote').value.trim(),date:$('#kDate').value||(rep?today():''),time:$('#kTime').value||'',due:$('#kDue').value||'',prio:+document.querySelector('input[name=kPrio]:checked').value,rep,until:rep?($('#kUntil').value||''):''};
    closeModal(); act(id?'Задача сохранена':'Задача добавлена',()=>{ if(id) Object.assign(state.tasks.find(x=>x.id===id),data); else state.tasks.push(Object.assign({id:'k'+Date.now().toString(36)+Math.random().toString(36).slice(2,5),done:'',doneOn:{},created:today()},data)); }); },
  'dy-del':el=>{ const id=el.dataset.id; closeModal(); act('Задача удалена',()=>{ state.tasks=state.tasks.filter(x=>x.id!==id); }); },
  'dy-move':el=>{ const d=el.dataset.d, nx=addDays(d,1); act('Невыполненные перенесены на '+fmtDs(nx),()=>{ state.tasks.forEach(k=>{ if(!k.rep&&k.date===d&&!k.done) k.date=nx; }); }); },
  'dy-od-today':()=>{ const t=today(); act('Просроченные задачи перенесены на сегодня',()=>{ overdueTasks().forEach(k=>{ if(!k.date||k.date<t) k.date=t; }); }); },
  'cal-nav':el=>{ const v=+el.dataset.v; if(v===0){ UI.cal=today().slice(0,8)+'01'; UI.calSel=today(); } else { const a=parseD(UI.cal); UI.cal=ds(new Date(a.getFullYear(),a.getMonth()+v,1)); } render(); },
  'cal-pick':el=>{ UI.calSel=el.dataset.d; render(); const c=document.querySelector('.cal-card'); if(c&&innerWidth<860) c.nextElementSibling.scrollIntoView({behavior:'smooth'}); },
  'st-now':el=>{ const id=el.dataset.id, x=findItem(id)||findText(id); if(!x) return; act('Начато сегодня',()=>{ x.start=''; }); },
  'link-open':el=>{ const it=findItem(el.dataset.id); const l=it&&(it.links||[])[+el.dataset.i]; if(l) openUrl(l.u); },
  'pdf-attach':el=>{ const id=el.dataset.id; if(HOST) hostSend('pdf-attach\n'+id); else { const f=$('#pdfFile'); f.dataset.id=id; f.click(); } },
  'pdf-open':el=>{ const it=findItem(el.dataset.id); if(!it||!it.pdf) return; const page=Math.max(1,Math.floor(itemDone(it))+1);
    if(HOST) return hostSend('pdf-open\n'+it.id+'\n'+page+'\n'+it.title);
    const w=window.open('','_blank'); IDB.get(it.id).then(b=>{ if(!b){ if(w) w.close(); return toast('PDF не найден на этом устройстве — прикрепите его заново'); } const u=URL.createObjectURL(b)+'#page='+page; if(w) w.location.href=u; else location.href=u; }).catch(e=>{ if(w) w.close(); toast('Не удалось открыть PDF: '+e.message); }); },
  'pdf-remove':el=>{ const id=el.dataset.id; if(!confirm('Убрать прикреплённый PDF?')) return; if(HOST) hostSend('pdf-remove\n'+id); else IDB.del(id).catch(()=>{}); act('PDF убран',()=>{ const it=findItem(id); if(it) delete it.pdf; }); },
  'ram-khatm':el=>{ const k=+el.dataset.k, R=ramadanRange(), t=today(), K=state.khatm, from=t>R.start?t:R.start, dleft=Math.max(1,diffDays(from,R.end)+1), pages=TOTAL_PAGES-K.cur.page+(k-1)*TOTAL_PAGES, g=Math.ceil(pages/dleft);
    if(t<R.start) return act(`План сохранён: ${k} ${plural(k,'хатм','хатма','хатмов')} за Рамадан — включится сам ${fmtD(R.start)}`,()=>{ K.ramPlan={k,start:R.start,end:R.end}; });
    act(`План на Рамадан: ${k} ${plural(k,'хатм','хатма','хатмов')}, ${g} стр. в день`,()=>{ K.goal=g; K.deadline=R.end; delete K.ramPlan; }); },
  'ram-day':el=>ramDayModal(+el.dataset.day),
  'ram-note-save':el=>{ const n=+el.dataset.day, R=ramadanRange(), v=($('#ramNote')||{}).value||''; closeModal(); act(null,()=>{ const Y=ramYear(R.year); Y[n]=Object.assign(Y[n]||{}, {note:v.trim()}); }); },
  'qada-add':()=>act('Восполненный пост отмечен',()=>{ (state.qada.made=state.qada.made||[]).push(today()); }),
  'qada-undo':()=>act('Отметка отменена',()=>{ (state.qada.made||[]).pop(); }),
});
Object.assign(CHG,{
  'rev-mode':el=>act(null,()=>{ state.quran.revMode=el.value; if(el.value==='cycle'&&!state.quran.cycleStart) state.quran.cycleStart=today(); }),
  'cyc-days':el=>{ const v=Math.max(1,Math.min(60,parseInt(el.value)||7)); act(null,()=>{ state.quran.cycleDays=v; state.quran.cycleStart=today(); }); },
  'cyc-order':el=>act(null,()=>{ state.quran.revOrder=el.value; }),
  'rl-mode':el=>{ UI.rl.mode=el.value; UI.rl.sel={}; $('#modalBox').innerHTML=revLogHtml(); },
  'rl-sel':el=>{ UI.rl.sel[el.dataset.k]=el.checked; },
  'rl-q':el=>{ UI.rl.q=+el.value; },
  'dy-date':el=>{ if(el.value){ UI.dday=el.value; render(); } },
  'dy-done':el=>{ const D=el.dataset.d, id=el.dataset.id; act(null,()=>{ const k=state.tasks.find(z=>z.id===id); if(!k) return; if(k.rep){ k.doneOn=k.doneOn||{}; if(el.checked) k.doneOn[D]=true; else delete k.doneOn[D]; } else k.done=el.checked?today():''; }); },
  'k-rep':el=>{ $('#kRepDays').hidden=el.value!=='week'; $('#kRepN').hidden=el.value!=='n'; $('#kUntilBox').hidden=!el.value; },
  'st-mode':el=>{ $('#fStartDate').hidden=el.value!=='date'; if($('#fHint')) formHint(); },
  'ram-fast':el=>{ const n=+el.dataset.day, R=ramadanRange(); act(null,()=>{ const Y=ramYear(R.year); Y[n]=Object.assign(Y[n]||{},{f:el.value}); }); },
  'ram-flag':el=>{ const n=+el.dataset.day, R=ramadanRange(); act(null,()=>{ const Y=ramYear(R.year); Y[n]=Object.assign(Y[n]||{},{[el.dataset.k]:el.checked}); }); },
});
ACH.push(
  {id:'cyc4',icon:'rev',t:'Четыре круга',d:'Пройти 4 полных круга повторения',p:()=>{ const by={}; for(const k in state.quran.cycleDone){ const no=k.split(':')[0]; by[no]=(by[no]||0)+1; } return [Object.values(by).filter(c=>c>=(state.quran.cycleDays||7)).length,4]; }},
  {id:'ram30',icon:'ramadan',t:'Весь Рамадан',d:'Отметить пост во все дни Рамадана',p:()=>{ const R=ramadanRange(); if(!R) return [0,1]; const Y=state.ramadan[R.year]||{}; let f=0; for(let i=1;i<=R.days;i++) if((Y[i]||{}).f==='y') f++; return [f,R.days]; }}
);

// обновлять «сегодня» после полуночи
let lastDay=today(); setInterval(()=>{ if(today()!==lastDay){ lastDay=today(); render(); } },60000);
render();
</script>
<script>if('serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost')) navigator.serviceWorker.register('sw.js').catch(function(){});</script>
</body>
