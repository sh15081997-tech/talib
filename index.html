/* ===================== ДЖУЗЫ И ЦЕЛИ ===================== */
const JUZ_START=[[1,1],[2,142],[2,253],[3,93],[4,24],[4,148],[5,82],[6,111],[7,88],[8,41],[9,93],[11,6],[12,53],[15,1],[17,1],[18,75],[21,1],[23,1],[25,21],[27,56],[29,46],[33,31],[36,28],[39,32],[41,47],[46,1],[51,31],[58,1],[67,1],[78,1]];
const JUZ_PAGE=[1,22,42,62,82,102,121,142,162,182,201,222,242,262,282,302,322,342,362,382,402,422,442,462,482,502,522,542,562,582];
// Страницы мусхафа по аятам. Опорные точки — начало каждой суры и каждого джуза (начала джузов в мединском мусхафе
// — точные страницы); между ними — пропорционально числу аятов. Вес аята = доля страницы, которую он занимает.
// (var и ленивый расчёт: достижения проверяются ещё при загрузке скрипта)
var PAGE_ANCH, AYAH_W;
function pageAnchors(){ if(PAGE_ANCH) return PAGE_ANCH; const cum=[0]; for(const S of SUR) cum.push(cum[cum.length-1]+S.ayahs);
  const m=new Map(); SUR.forEach((S,k)=>m.set(cum[k],S.pos)); JUZ_START.forEach(([s,a],i)=>m.set(cum[s-1]+a-1,JUZ_PAGE[i]-1)); m.set(cum[114],TOTAL_PAGES);
  return PAGE_ANCH={cum,pts:[...m.entries()].sort((x,y)=>x[0]-y[0])}; }
function anchorSeg(g){ const pts=pageAnchors().pts; let i=0; while(i<pts.length-2&&pts[i+1][0]<=g) i++; return [pts[i],pts[i+1]]; }
function ayahPage(s,a){ const g=pageAnchors().cum[s-1]+a-0.5, [[g0,p0],[g1,p1]]=anchorSeg(g), pos=p0+(p1-p0)*(g-g0)/(g1-g0); return Math.max(1,Math.min(TOTAL_PAGES,Math.floor(pos)+1)); }
function ayW(s,a){ if(!AYAH_W) AYAH_W=SUR.map(S=>{ const w=new Float64Array(S.ayahs), c=pageAnchors().cum[S.n-1]; for(let x=1;x<=S.ayahs;x++){ const [[g0,p0],[g1,p1]]=anchorSeg(c+x-0.5); w[x-1]=(p1-p0)/(g1-g0); } return w; }); return AYAH_W[s-1][a-1]; }
function memPg(s){ const m=memStr(s); let p=0; for(let i=0;i<m.length;i++) if(m.charCodeAt(i)===49) p+=ayW(s,i+1); return p; }
const JUZ=JUZ_START.map(([s,a],i)=>{ const nx=JUZ_START[i+1]; let es,ea;
  if(!nx){ es=114; ea=SUR[113].ayahs; } else if(nx[1]===1){ es=nx[0]-1; ea=SUR[es-1].ayahs; } else { es=nx[0]; ea=nx[1]-1; }
  return {n:i+1,s,a,es,ea}; });
function juzSegments(j){ const J=JUZ[j-1], out=[]; for(let s=J.s;s<=J.es;s++) out.push({s,from:s===J.s?J.a:1,to:s===J.es?J.ea:SUR[s-1].ayahs}); return out; }
function segStats(segs){ let tot=0,mem=0,pg=0,pgMem=0;
  for(const g of segs){ const m=memStr(g.s); for(let a=g.from;a<=g.to;a++){ const per=ayW(g.s,a); tot++; pg+=per; if(m.charCodeAt(a-1)===49){ mem++; pgMem+=per; } } }
  return {tot,mem,pg,pgMem,frac:tot?mem/tot:0}; }
const juzStats=j=>segStats(juzSegments(j));
const rangeSegs=(a,b)=>{ const o=[]; for(let s=a;s<=b;s++) o.push({s,from:1,to:SUR[s-1].ayahs}); return o; };
const goalSegs=g=>g.kind==='juz'?juzSegments(g.n):rangeSegs(g.from,g.to);
const goalName=g=>g.kind==='juz'?`Джуз ${g.n}`:(g.from===g.to?`Сура ${g.from}. ${SUR[g.from-1].name}`:`Суры ${g.from}–${g.to}`);
const segText=g=>{ const S=SUR[g.s-1]; return g.from===1&&g.to===S.ayahs?'вся сура':g.from===g.to?'аят '+g.from:'аяты '+g.from+'–'+g.to; };
function goalInfo(g){
  const q=state.quran, t=today(), st=segStats(goalSegs(g)), rem=Math.max(0,st.pg-st.pgMem);
  const res={st,rem,done:st.mem>=st.tot};
  if(res.done){ res.pill='<span class="pill ok">'+ico('check')+'достигнута</span>'; return res; }
  if(g.deadline){
    if(g.deadline<t){ res.pill='<span class="pill bad">срок прошёл</span>'; return res; }
    const sf=(state.log.hifz[t]||0)>0?addDays(t,1):t, sd=studyDaysBetween(sf,g.deadline,q.wd);
    if(sd<=0){ res.pill='<span class="pill bad">нет учебных дней</span>'; return res; }
    res.need=rem/sd;
    res.pill=q.goal>0&&res.need<=q.goal+1e-6?`<span class="pill ok">успеваете · нужно ≈${fmt(Math.max(res.need,0.1))} стр./день</span>`:`<span class="pill warn">нужно ≈${fmt(Math.max(res.need,0.1))} стр./день</span>`;
  } else res.pill='<span class="pill">без срока</span>';
  return res;
}
function goalsCard(bare){
  const q=state.quran;
  let h=`${bare?'<div>':`<div class="card"><h2>${ico('target')}Цели заучивания</h2>`}<div class="sub">Например: «выучить 29-й джуз к Рамадану». Программа посчитает, сколько страниц в день нужно.</div><div class="goals">`;
  if(!q.goals.length) h+=`<div class="msg">Целей пока нет — добавьте первую ниже.</div>`;
  for(const g of q.goals){ const I=goalInfo(g);
    h+=`<div class="goal"><div class="kv"><span><b>${esc(goalName(g))}</b>${g.deadline?` · к ${fmtD(g.deadline)}`:''}</span><span class="row" style="gap:6px">${I.pill}<button class="btn ghost sm icon" data-act="goal-del" data-id="${g.id}" title="Удалить цель">✕</button></span></div>
      ${bar(I.st.frac)}<div class="sub">${I.st.mem} из ${I.st.tot} аятов · ≈${fmt(I.st.pgMem)} из ${fmt(I.st.pg)} стр.${I.done?'':` · осталось ≈${fmt(I.rem)} стр.`}</div></div>`; }
  h+=`</div><div class="row goal-add"><select id="gKind" data-chg="goal-kind"><option value="juz">Джуз</option><option value="range">Суры</option></select>
    <select id="gJuz">${JUZ.map(J=>`<option value="${J.n}" ${J.n===29?'selected':''}>${J.n}</option>`).join('')}</select>
    <span id="gRange" class="row" hidden>с <input type="number" id="gFrom" min="1" max="114" value="67" style="width:70px"> по <input type="number" id="gTo" min="1" max="114" value="77" style="width:70px"></span>
    <span>к</span><input type="date" id="gDate" min="${today()}"><button class="btn primary sm" data-act="goal-add">${ico('plus')}Добавить</button></div></div>`;
  return h;
}
function juzCard(){
  return `<div class="card"><h2>${ico('grid')}Джузы</h2><div class="sub">Прогресс по 30 джузам. Нажмите на джуз, чтобы увидеть его суры.</div><div class="juz-grid">${JUZ.map(J=>{ const s=juzStats(J.n), p=Math.floor(s.frac*100);
    return `<button class="juz${s.frac>=1?' full':''}" data-act="juz-open" data-j="${J.n}" data-tt="${esc('Джуз '+J.n+': '+s.mem+' из '+s.tot+' аятов')}"><span class="jn">${J.n}</span><span class="jp">${s.frac>=1?ico('check'):p+'%'}</span><span class="jb"><i style="width:${s.frac*100}%"></i></span></button>`; }).join('')}</div></div>`;
}
function openJuz(j){ UI.modalRefresh=()=>{ $('#modalBox').innerHTML=juzHtml(j); }; openModal(juzHtml(j)); }
function juzHtml(j){
  const segs=juzSegments(j), st=segStats(segs);
  return `<div class="mhead"><div class="card-h" style="margin:0;flex:1"><span class="n-badge full" style="height:38px;min-width:38px;border-radius:12px;font-size:14px">${j}</span><div class="ch-t"><h2>Джуз ${j}</h2><div class="sub">${segs.length} ${plural(segs.length,'сура','суры','сур')} · ≈${fmt(st.pg)} стр. · выучено ${Math.floor(st.frac*100)}% (${st.mem} из ${st.tot} аятов)</div></div></div><button class="btn ghost icon" data-act="close">✕</button></div>
  ${bar(st.frac,'thick')}
  <div class="scroll" style="margin-top:14px;max-height:50vh"><table class="list"><tbody>${segs.map(g=>{ const S=SUR[g.s-1], s2=segStats([g]); const cls=s2.frac>=1?'full':s2.mem?'part':'none';
    return `<tr><td><span class="n-badge ${cls}">${S.n}</span></td><td><b>${esc(S.name)}</b><div class="sub">${segText(g)}</div></td><td class="ar">${ARABIC[S.n-1]}</td><td style="width:26%">${bar(s2.frac)}</td><td class="num right nowrap">${s2.mem} / ${s2.tot}</td><td class="right"><button class="btn sm" data-act="sur-open" data-s="${S.n}">Аяты</button></td></tr>`; }).join('')}</tbody></table></div>
  <div class="mfoot"><button class="btn" data-act="juz-mark" data-j="${j}" data-m="clear">Снять отметку</button><span class="spacer"></span><button class="btn" data-act="juz-mark" data-j="${j}" data-m="earlier">Выучен ранее</button><button class="btn primary" data-act="juz-mark" data-j="${j}" data-m="today">${ico('check')}Выучен сегодня</button></div>`;
}

/* ===================== ТЕКСТЫ (хадисы, мутуны, дуа) ===================== */
const findText=id=>state.texts.find(x=>x.id===id);
const txMem=x=>Object.keys(x.mem).length;
const txLabel=(x,i)=>x.items[i]?`№${i+1} · ${x.items[i]}`:`№${i+1}`;
function txNext(x,n){ const o=[]; for(let i=0;i<x.items.length&&o.length<n;i++) if(!(i in x.mem)) o.push(i); return o; }
function txRec(x,i){ return x.rev[i]||{last:x.mem[i]||x.created||today(),ivl:x.mem[i]?1:3,q:3,n:0}; }
function txDue(x){ const t=today(); return Object.keys(x.mem).map(Number).map(i=>({i,r:txRec(x,i)})).map(o=>Object.assign(o,{st:srsState(o.r)}))
  .filter(o=>o.r.last!==t&&o.st.over>=0).sort((a,b)=>b.st.over-a.st.over||a.r.q-b.r.q||a.i-b.i); }
function txAddLog(x,key,date,v){ const L=x[key]; L[date]=r3((L[date]||0)+v); if(Math.abs(L[date])<1e-9) delete L[date]; }
function textCard(x){
  const t=LD(), dw=dayWord(t,true), tot=x.items.length, m=txMem(x), tv=x.log[t]||0, g=+x.goal||0, st=streak(x.log,g,x.wd), due=txDue(x);
  let h=`<div class="card task">${cardHead('texts',esc(x.title),(x.author?esc(x.author)+' · ':'')+uN(x.mu,tot),streakPill(st)+pdfIconBtn(x)+`<button class="btn ghost sm icon" data-act="tx-detail" data-id="${x.id}" title="Открыть">${ico('chart')}</button>`,'gold')}
    <div class="task-main">${ring(tot?m/tot:0,m+'/'+tot,'выучено',84,'gold')}<div class="task-info">
    <div style="font-weight:600">${m>=tot?'Всё выучено — ма ша Аллах!':g>0?`${dw}: ${fmt(tv)} из ${fmt(g)}`:`${dw} выучено: ${fmt(tv)}`}</div>
    ${startPill(x)}${g>0&&tv>=g-1e-6&&m<tot?`<span class="pill ok">${ico('check')}цель выполнена</span>`:''}${x.deadline&&m<tot?`<span class="pill">${ico('cal')}до ${fmtD(x.deadline)}</span>`:''}</div></div>`;
  if(isPlanned(x)) return h+`<div class="row" style="margin-top:10px"><span class="sub">начнётся через ${daysW(diffDays(today(),x.start))}</span><span class="spacer"></span><button class="btn sm" data-act="st-now" data-id="${x.id}">Начать сегодня</button></div></div>`;
  if(m<tot){ const n=g>0?Math.max(1,Math.ceil(tv<g?g-tv:g)):1, nx=txNext(x,n);
    h+=`<div class="portion-box"><div class="pb-t">${g>0&&tv>=g?'Следующее (сверх плана)':'Следующее для заучивания'}</div><ul class="portion">${nx.slice(0,4).map(i=>`<li><span>${esc(txLabel(x,i))}</span></li>`).join('')}${nx.length>4?`<li class="muted">и ещё ${nx.length-4}…</li>`:''}</ul>
    <div class="row"><button class="btn primary sm" data-act="tx-learn" data-id="${x.id}" data-n="${nx.length}">${ico('check')}Выучил${nx.length>1?' ('+nx.length+')':''}</button><button class="btn sm" data-act="tx-detail" data-id="${x.id}">Отметить вручную…</button></div></div>`; }
  h+=mrTodayHtml(x);
  return h+'</div>';
}
function pageTexts(){
  const L=state.texts;
  let h=pageHead('texts','Заучивание матнов','Хадисы, мутуны, назмы, дуа — по хадисам, страницам или строкам: заучивание, дневная норма, дедлайн и повторение по кругу (по умолчанию раз в месяц) или умное.',
    (L.length?dayChip():'')+`<button class="btn" data-act="tx-preset">${ico('sparkle')}40 хадисов ан-Навави</button><button class="btn primary" data-act="tx-new">${ico('plus')}Добавить матн</button>`)+'<div class="stack">';
  if(!L.length) return h+`<div class="empty"><div class="empty-ico">${ico('texts')}</div><div class="empty-t">Пока нет матнов</div><div class="sub">Добавьте сборник хадисов, мутун, назм или список дуа. Можно указать количество (хадисов, страниц, строк) или вставить список названий — по одному на строку.</div><div class="row" style="justify-content:center"><button class="btn" data-act="tx-preset">${ico('sparkle')}40 хадисов ан-Навави (42)</button><button class="btn primary" data-act="tx-new">${ico('plus')}Свой матн</button></div></div></div>`;
  h+=`<div class="grid">${L.map(textCard).join('')}</div>`+mrBlock();
  const agg={}; for(const x of L) for(const d in x.log) agg[d]=r3((agg[d]||0)+x.log[d]);
  h+=`<div class="grid2"><div class="card"><h2>${ico('chart')}Выучено по дням</h2><div class="sub">единиц за день по всем матнам</div>${barChart(agg,{unit:'ед.'})}</div><div class="card"><h2>${ico('cal')}Календарь</h2>${heatmap(agg,{unit:'ед.'})}</div></div>`;
  return h+'</div>';
}

  <label class="f"><span>Дни занятий</span></label>${wdChips(x.wd,'none','class="twd"')}

  $('#tTitle').focus();

function reportCsv(){
  const R=periodRange(UI.rep.kind,UI.rep.off), L=dayLogs(), n=v=>String(r3(v||0)).replace('.',',');
  const rows=[['Дата','Заучено, стр.','Повторено, стр.','Чтение Корана, стр.','Прочитано книг, стр.','Уроки, ед.','Тексты, пунктов','Время, мин']];
  const tot=[0,0,0,0,0,0,0]; const end=R.to>today()?today():R.to;
  for(let d=R.from,i=0;d<=end&&i<400;d=addDays(d,1),i++){ const v=[L.hifz[d],L.rev[d],L.khatm[d],L.book[d],L.lesson[d],L.text[d],L.time[d]].map(x=>x||0); v.forEach((x,j)=>tot[j]+=x); rows.push([parseD(d).toLocaleDateString('ru-RU'),...v.map(n)]); }
  rows.push(['Итого',...tot.map(n)]);
  const inP=it=>sumR(it.log,R.from,R.to)>0, finP=it=>!!it.finished&&it.finished>=R.from&&it.finished<=R.to, B=state.items.filter(i=>i.kind==='book'), Ls=state.items.filter(i=>i.kind==='lesson');
  rows.push([]); rows.push(['Книг читали',B.filter(inP).length]); rows.push(['Книг завершено',B.filter(finP).length]); rows.push(['Курсов уроков занимались',Ls.filter(inP).length]); rows.push(['Курсов завершено',Ls.filter(finP).length]);
  rows.push([]); rows.push(['Книги и курсы','Тип','За период','Пройдено всего','Всего','Единица','Завершено']);
  for(const it of state.items) rows.push([it.title,it.kind==='book'?'книга':'уроки',n(sumR(it.log,R.from,R.to)),n(itemDone(it)),n(it.total),it.unit,it.finished?parseD(it.finished).toLocaleDateString('ru-RU'):'']);
  for(const x of state.texts) rows.push([x.title,'текст',n(sumR(x.log,R.from,R.to)),n(txMem(x)),n(x.items.length),'пунктов']);
  const csv='﻿'+rows.map(r=>r.map(c=>{ c=String(c==null?'':c); return /[;"\n]/.test(c)?'"'+c.replace(/"/g,'""')+'"':c; }).join(';')).join('\r\n');
  const name=`talib-otchet-${R.from}_${R.to}.csv`;
  if(HOST) hostSend('savefile\n'+name+'\n'+csv);
  else saveFileWeb(name,csv,'text/csv').then(r=>{ if(r!=='cancel') toast(r==='shared'?'Таблица передана — сохраните её в «Файлы» или отправьте себе':'Таблица сохранена в «Загрузки»'); });
}
// Веб-версия: на телефоне/планшете — через «Поделиться» (Сохранить в Файлы, мессенджер), на компьютере — загрузка файла.
function saveFileWeb(name,text,mime){
  const blob=new Blob([text],{type:mime});
  try{ const f=new File([blob],name,{type:mime});
    if(IS_TOUCH&&navigator.canShare&&navigator.canShare({files:[f]})) return navigator.share({files:[f],title:name}).then(()=>'shared',e=>e&&e.name==='AbortError'?'cancel':download()); }catch(e){}
  return Promise.resolve(download());
  function download(){ const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name; document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); },1500); return 'downloaded'; }
}

// all=true — список всех задач дня без учёта прогресса (для напоминания на телефоне, если приложение сегодня не открывали)
function pendingTasks(all){
  const t=today(), q=state.quran, T=quranTotals(), out=[];
  const left=(v,g)=>all||v<g-1e-6;
  if(all||q.wd[dow(t)]){
    if(isOn('hifz')&&q.goal>0&&T.pg<TOTAL_PAGES-1e-6&&left(state.log.hifz[t]||0,q.goal)) out.push(all?'заучивание':`заучивание (${fmt(state.log.hifz[t]||0)} из ${fmt(q.goal)} стр.)`);
    if(isOn('rev')&&revGoal()>0&&T.ay>0&&left(state.log.rev[t]||0,revGoal())) out.push(all?'повторение':`повторение (${fmt(state.log.rev[t]||0)} из ${fmt(revGoal())} стр.)`);
  }
  if(isOn('diary')){ const L=tasksOn(t), left_=L.filter(k=>!isDone(k,t)).length; if(L.length&&left_) out.push(all?'задачи ежедневника':`задачи ежедневника (${left_})`); }
  for(const it of state.items) if(isOn(it.kind==='book'?'books':'lessons')&&!it.finished&&!isPlanned(it)&&it.dMode==='fixed'&&it.daily>0&&(all||it.wd[dow(t)])&&left(it.log[t]||0,it.daily)) out.push(`«${it.title}»`);
  if(isOn('texts')) for(const x of state.texts) if(+x.goal>0&&!isPlanned(x)&&(all||x.wd[dow(t)])&&txMem(x)<x.items.length&&left(x.log[t]||0,x.goal)) out.push(`«${x.title}»`);
  { const K=state.khatm; if(isOn('khatm')&&K.goal>0&&(all||K.wd[dow(t)])&&left(K.log[t]||0,K.goal)) out.push(all?'чтение Корана':`чтение Корана (${fmt(K.log[t]||0)} из ${fmt(K.goal)} стр.)`); }
  return out;
}

function khAdd(pages,date){ // возвращает true, если хатм завершён
  const K=state.khatm; date=date||today(); let left=r3(pages), fin=false;
  if(left<0){ const take=Math.max(left,-K.cur.page); K.cur.page=r3(K.cur.page+take); addLogTo(K.log,date,take); return false; }
  while(left>1e-9){ const take=Math.min(TOTAL_PAGES-K.cur.page,left); K.cur.page=r3(K.cur.page+take); addLogTo(K.log,date,take); left=r3(left-take);

  return fin;
}

// Всё выученное делится на N дней (по умолчанию 7): каждый день — своя порция.
function revGoal(){ const q=state.quran; if(q.revMode==='smart') return +q.revGoal||0; const P=quranTotals().pg; return P>0?r3(P/(q.cycleDays||7)):0; }
function juzOfAyah(s,a){ let j=1; for(const J of JUZ){ if(J.s<s||(J.s===s&&J.a<=a)) j=J.n; } return j; }
function cycleInfo(){
  const q=state.quran, N=q.cycleDays||7, t=today(), ord=q.revOrder||'asc';
  const portions=Array.from({length:N},()=>({segs:[],pg:0})), total=quranTotals().pg, per=total/N;
  // Выученное по джузам (в порядке повторения). Если джузов не меньше, чем дней круга, — режем по границам джузов
  // (7 джузов → по джузу в день, 14 → по два); иначе делим по аятам поровну.
  const juzUnits=[]; for(const J of (ord==='desc'?[...JUZ].reverse():JUZ)){ const segs=[]; let pg=0;
    for(const g of juzSegments(J.n)){ const m=memStr(g.s); let cur=null;
      for(let a=g.from;a<=g.to;a++){ if(m.charCodeAt(a-1)===49){ if(cur&&cur.to===a-1) cur.to=a; else { cur={s:g.s,from:a,to:a}; segs.push(cur); } pg+=ayW(g.s,a); } } }
    if(pg>0) juzUnits.push({segs,pg}); }
  if(total>0&&juzUnits.length>=N){
    // джузы подряд делим на N групп так, чтобы самый большой день был как можно меньше (у каждого дня хотя бы один джуз)
    const n=juzUnits.length, pre=[0]; juzUnits.forEach(U=>pre.push(pre[pre.length-1]+U.pg));
    const dp=Array.from({length:N+1},()=>Array(n+1).fill(Infinity)), cut=Array.from({length:N+1},()=>Array(n+1).fill(0)); dp[0][0]=0;
    for(let k=1;k<=N;k++) for(let i=k;i<=n;i++) for(let j=k-1;j<i;j++){ const v=Math.max(dp[k-1][j],pre[i]-pre[j]); if(v<dp[k][i]-1e-9){ dp[k][i]=v; cut[k][i]=j; } }
    for(let k=N,i=n;k>0;k--){ const j=cut[k][i]; for(let u=j;u<i;u++){ portions[k-1].segs.push(...juzUnits[u].segs); portions[k-1].pg+=juzUnits[u].pg; } i=j; } }
  else if(total>0){ let acc=0;
    for(const S of (ord==='desc'?[...SUR].reverse():SUR)){ const m=memStr(S.n); if(m.indexOf('1')<0) continue;
      for(let a=1;a<=S.ayahs;a++){ if(m.charCodeAt(a-1)!==49) continue;
        const pa=ayW(S.n,a), i=Math.min(N-1,Math.floor((acc+pa/2)/per+1e-9)), P=portions[i], L=P.segs[P.segs.length-1];
        if(L&&L.s===S.n&&L.to===a-1) L.to=a; else P.segs.push({s:S.n,from:a,to:a}); P.pg+=pa; acc+=pa; } } }
  const start=q.cycleStart||t, dd=Math.max(0,diffDays(start,t)), no=Math.floor(dd/N);
  return {N,portions,total,per,idx:dd%N,no,curStart:addDays(start,no*N),pending:start>t};
}
function portionLabel(P){
  if(!P.segs.length) return '—';
  // целые джузы — называем джузами
  const whole=JUZ.filter(J=>{ const js=juzSegments(J.n); return js.every(g=>P.segs.some(x=>x.s===g.s&&x.from<=g.from&&x.to>=g.to)); }).map(J=>J.n);
  if(whole.length){ const pgW=whole.reduce((a,j)=>a+juzStats(j).pg,0); if(Math.abs(pgW-P.pg)<0.6) return whole.length===1?`Джуз ${whole[0]}`:`Джузы ${whole.join(', ')}`; }
  const a=P.segs[0], b=P.segs[P.segs.length-1], A=SUR[a.s-1], B=SUR[b.s-1];
  const ja=juzOfAyah(a.s,a.from), jb=juzOfAyah(b.s,b.to);
  const one=(S,x,full,pos)=>`${S.n}. ${S.name}${full?'':' '+(pos==='a'?x.from:x.to)}`;
  if(P.segs.length===1&&a.from===1&&a.to===A.ayahs) return `${A.n}. ${A.name} · джуз ${ja}`;
  if(P.segs.length===1) return `${A.n}. ${A.name}, аяты ${a.from}–${a.to} · джуз ${ja}`;
  return `${one(A,a,a.from===1,'a')} → ${one(B,b,b.to===B.ayahs,'b')} · ${ja===jb?'джуз '+ja:'джузы '+ja+'–'+jb}`;
}
// ключ порции учитывает настройки круга (начало, длину, порядок): при их смене старые отметки не путаются с новыми
const cycSig=()=>{ const q=state.quran; return `${q.cycleStart}/${q.cycleDays||7}/${q.revOrder||'asc'}`; };
const cycKey=(no,i)=>cycSig()+'#'+no+':'+i;
// Отмечает повторение набора отрезков: страницы в журнал, оценка сурам, закрывает порции круга
function applyRevSegs(segs,quality,date,forcePages){
  const q=state.quran, cov={};
  for(const g of segs){ const m=memStr(g.s); for(let a=g.from;a<=g.to;a++) if(m.charCodeAt(a-1)===49){ (cov[g.s]=cov[g.s]||new Set()).add(a); } }
  let pages=0; for(const s in cov) for(const a of cov[s]) pages+=ayW(+s,a);
  if(forcePages>0) pages=forcePages; // «повторил стр. с … по …» — засчитываем ровно эти страницы
  if(pages<=0) return 0;
  addLog('rev',date,pages); markRevPages(segs,date);
  for(const s in cov){ if(cov[s].size===memCount(+s)){ q.rev[s]=srsNext(revRec(+s),quality,date); if(!q.lastRev[s]||q.lastRev[s]<date) q.lastRev[s]=date; } }
  if(q.revMode!=='smart'){ const C=cycleInfo(), d0=diffDays(C.curStart,date);
    // порция засчитывается, если повторено ≥90% её аятов (в т.ч. если повторили заранее)
    if(!C.pending&&d0>=0&&d0<C.N) C.portions.forEach((P,i)=>{ if(q.cycleDone[cycKey(C.no,i)]||!P.segs.length) return; let tot=0,hit=0;
      for(const g of P.segs) for(let a=g.from;a<=g.to;a++){ tot++; if(cov[g.s]&&cov[g.s].has(a)) hit++; }
      if(tot&&hit/tot>=0.9) q.cycleDone[cycKey(C.no,i)]=date; }); }
  return pages;
}

const REP_TXT={day:'каждый день',wd:'по будням',week:'по дням недели',month:'каждый месяц',n:'каждые N дней'};
function occurs(k,D){
  if(!k.rep) return k.date===D;
  const s=k.date||k.created||today(); if(D<s||(k.until&&D>k.until)) return false;
  const r=k.rep, w=dow(D);
  if(r.t==='day') return true; if(r.t==='wd') return w>=1&&w<=5;
  if(r.t==='week') return (r.days||[]).includes(w);
  if(r.t==='month'){ const sd=parseD(s).getDate(), dd=parseD(D), last=new Date(dd.getFullYear(),dd.getMonth()+1,0).getDate(); return dd.getDate()===Math.min(sd,last); }
  if(r.t==='n') return diffDays(s,D)%Math.max(1,r.n||2)===0;
  return false;
}
function isDone(k,D){ return k.rep?!!(k.doneOn&&k.doneOn[D]):!!k.done; }
function tasksOn(D){ return state.tasks.filter(k=>occurs(k,D)).sort((a,b)=>(isDone(a,D)-isDone(b,D))||((a.time||'99')<(b.time||'99')?-1:(a.time||'99')>(b.time||'99')?1:0)||(b.prio||0)-(a.prio||0)); }
const overdueTasks=()=>{ const t=today(); return state.tasks.filter(k=>!k.rep&&!k.done&&((k.date&&k.date<t)||(k.due&&k.due<t&&(!k.date||k.date<t)))); };
const soonDeadlines=()=>{ const t=today(), lim=addDays(t,14); return state.tasks.filter(k=>k.due&&!isDone(k,t)&&(!k.rep)&&k.due>=t&&k.due<=lim).sort((a,b)=>a.due<b.due?-1:1); };

// Быстрый ввод: «завтра в 18:00 позвонить маме !», «каждый день читать азкары», «по пн и чт урок», «отчёт до 20.11 !!»
const WD_FORMS=[['воскрес',0],['понедел',1],['вторн',2],['сред',3],['четвер',4],['пятниц',5],['суббот',6]];
const WD_SHORT={'пн':1,'вт':2,'ср':3,'чт':4,'пт':5,'сб':6,'вс':0};
function parseQuick(s,base){
  let t=' '+s+' ', date=base, time='', prio=0, due='', rep=null;
  const cut=re=>{ const m=t.match(re); if(m) t=t.replace(m[0],' '); return m; };
  let m;
  if(cut(/\s!!+(?=\s)/)) prio=2; else if(cut(/\s!(?=\s)/)) prio=1;
  if((m=cut(/\sдо\s+(\d{1,2})\.(\d{1,2})(?:\.(\d{2,4}))?(?=\s)/i))){ const y=m[3]?(m[3].length===2?2000+ +m[3]:+m[3]):parseD(base).getFullYear(); due=ds(new Date(y,+m[2]-1,+m[1])); if(!m[3]&&due<today()) due=ds(new Date(y+1,+m[2]-1,+m[1])); }
  else if(cut(/\sдо\s+завтра(?=\s)/i)) due=addDays(today(),1);
  if((m=cut(/\s(?:в\s+)?([01]?\d|2[0-3])[:.]([0-5]\d)(?=\s)/i))) time=m[1].padStart(2,'0')+':'+m[2];
  if(cut(/\s(каждый\s+день|ежедневно)(?=\s)/i)) rep={t:'day'};
  else if(cut(/\sпо\s+будням(?=\s)/i)) rep={t:'wd'};
  else if(cut(/\sпо\s+выходным(?=\s)/i)) rep={t:'week',days:[6,0]};
  else if(cut(/\s(каждый\s+месяц|ежемесячно)(?=\s)/i)) rep={t:'month'};
  else if(cut(/\sчерез\s+день(?=\s)/i)) rep={t:'n',n:2};
  else if((m=cut(/\sкаждые\s+(\d+)\s+д[а-я]*(?=\s)/i))) rep={t:'n',n:+m[1]};
  else if(cut(/\s(каждую\s+неделю|еженедельно)(?=\s)/i)) rep={t:'week',days:[dow(base)]};
  if(!rep){ // «по пн и чт», «по понедельникам, средам»
    const w=t.trim().split(/\s+/);
    const tok=x=>{ x=x.toLowerCase().replace(/[,.]$/,''); if(WD_SHORT[x]!=null) return WD_SHORT[x]; const f=WD_FORMS.find(z=>x.startsWith(z[0])); return f&&/(ам|ям)$/.test(x)?f[1]:null; };
    for(let i=0;i<w.length-1;i++){ if(w[i].toLowerCase()!=='по') continue; const days=[]; let j=i+1;
      for(;j<w.length;j++){ const x=w[j].toLowerCase(); if(x==='и'||x===',') continue; const d=tok(x); if(d==null) break; days.push(d); }
      if(days.length){ rep={t:'week',days:[...new Set(days)]}; w.splice(i,j-i); t=' '+w.join(' ')+' '; break; } } }
  if(cut(/\sпослезавтра(?=\s)/i)) date=addDays(today(),2);
  else if(cut(/\sзавтра(?=\s)/i)) date=addDays(today(),1);
  else if(cut(/\sсегодня(?=\s)/i)) date=today();
  else if(cut(/\sпозавчера(?=\s)/i)) date=addDays(today(),-2);
  else if(cut(/\sвчера(?=\s)/i)) date=addDays(today(),-1);
  else if((m=cut(/\s(?:в|во)\s+(понедельник|вторник|среду|четверг|пятницу|субботу|воскресенье)(?=\s)/i))){ const f=WD_FORMS.find(x=>m[1].toLowerCase().startsWith(x[0].slice(0,4))); if(f){ let d=addDays(today(),1); while(dow(d)!==f[1]) d=addDays(d,1); date=d; } }
  return {text:t.replace(/\s+/g,' ').trim(),date,time,prio,due,rep};
}

let RAM_CACHE=null;
function ramadanRange(){
  const t=today(); if(RAM_CACHE&&RAM_CACHE.t===t) return RAM_CACHE.r;
  const find=(from)=>{ for(let i=0;i<420;i++){ const d=addDays(from,i), h=hijriParts(d); if(h.m===9&&h.d===1){ let end=addDays(d,28); for(let j=28;j<=31;j++){ const e=addDays(d,j), he=hijriParts(e); if(he.m===10&&he.d===1){ end=addDays(e,-1); break; } } return {start:d,end,year:h.y,days:diffDays(d,end)+1}; } } return null; };
  let r=find(addDays(t,-35)); if(r&&r.end<t) r=find(addDays(r.end,300));
  RAM_CACHE={t,r}; return r;
}

function applyRamPlan(){ const K=state.khatm, P=K.ramPlan, t=today(); if(!P||t<P.start) return; delete K.ramPlan; if(t>P.end) return save();
  if(P.p){ K.goal=P.p; K.deadline=''; }
  else { const pages=TOTAL_PAGES-K.cur.page+(P.k-1)*TOTAL_PAGES; K.goal=Math.ceil(pages/Math.max(1,diffDays(t,P.end)+1)); K.deadline=P.end; }
  save(); setTimeout(()=>toast(`Рамадан мубарак! Вирд на Рамадан: ${K.goal} стр. в день`),300); }
// Рамадан: сколько дней чтения осталось (с сегодняшнего или с первого дня)
function ramDaysLeft(R){ const t=today(), from=t>R.start?t:R.start; return Math.max(1,diffDays(from,R.end)+1); }

function ramCalcHtml(){
  const R=ramadanRange(); if(!R) return ''; const K=state.khatm, dl=ramDaysLeft(R), rem=TOTAL_PAGES-K.cur.page, done=ramStats(R).khatms, pre=today()<R.start;
  if(UI.rpm==='p'){ const P=UI.ramP; if(!(P>0)) return 'Укажите, сколько страниц в день вы хотите читать.';
    const total=P*dl, reach=K.cur.page+total, kh=Math.floor(reach/TOTAL_PAGES), rest=Math.round(reach-kh*TOTAL_PAGES);
    let s=`${P} стр. в день × ${daysW(dl)} = <b>${fmt(total)} стр.</b> (≈${fmt(total/20)} джуза)<br>`;
    s+=kh>0?`За Рамадан вы завершите <b>≈ ${kh} ${plural(kh,'хатм','хатма','хатмов')}</b>${done?` (плюс уже ${done} в этом Рамадане)`:''}${rest>0?` и прочитаете ещё ${rest} стр. следующего`:''}.`
      :`Текущий хатм за Рамадан не завершится: дойдёте до стр. ${Math.floor(reach)} из ${TOTAL_PAGES}. Для хатма нужно ${Math.ceil(rem/dl)} стр. в день.`;
    return s; }
  const k=UI.ramK; if(!(k>=1)) return 'Укажите, сколько хатмов вы хотите сделать.';

}

function pagesMemStat(a,b){ let tot=0,mem=0; for(const g of pagesToSegs(a,b)){ const m=memStr(g.s); for(let x=g.from;x<=g.to;x++){ tot++; if(m.charCodeAt(x-1)===49) mem++; } } return {tot,mem}; }
function markPages(a,b,on,date){ for(const g of pagesToSegs(a,b)){ const arr=memArr(g.s); for(let x=g.from;x<=g.to;x++) arr[x-1]=on; applyMem(g.s,arr,date); } }
function readPages(ida,idb){ const A=$('#'+ida), B=$('#'+idb); let a=parseInt(A&&A.value), b=parseInt(B&&(B.value||B.placeholder)); if(!(a>=1&&b>=1)) return null; if(a>b)[a,b]=[b,a]; return [Math.min(a,TOTAL_PAGES),Math.min(b,TOTAL_PAGES)]; }
function portionPages(P){ const iv=P.segs.map(g=>[ayahPage(g.s,g.from),ayahPage(g.s,g.to)]).sort((x,y)=>x[0]-y[0]), out=[];
  for(const [a,b] of iv){ const L=out[out.length-1]; if(L&&a<=L[1]+1) L[1]=Math.max(L[1],b); else out.push([a,b]); }

// state.quran.pages[p] = {d: когда последний раз повторялась, q: оценка 3 твёрдо / 2 с ошибками / 1 слабо}
function markRevPages(segs,date){ const P=state.quran.pages=state.quran.pages||{};
  for(const g of segs){ const m=memStr(g.s); for(let a=g.from;a<=g.to;a++){ if(m.charCodeAt(a-1)!==49) continue; const p=ayahPage(g.s,a), r=P[p]=P[p]||{}; if(!r.d||r.d<date) r.d=date; } } }
function memPageSet(){ const set=new Set(); for(const S of SUR){ const m=memStr(S.n); if(m.indexOf('1')<0) continue; for(let a=1;a<=S.ayahs;a++) if(m.charCodeAt(a-1)===49) set.add(ayahPage(S.n,a)); } return set; }
const PQ={3:'твёрдо',2:'с ошибками',1:'слабо'};
const pgAge=(P,t)=>!P||!P.d?null:diffDays(P.d,t);

  if(!rows.length) return '<div class="msg">Отметьте выученное в «Заучивании».</div>';
  return `<div class="scroll"><table class="list revtab"><thead><tr><th>№</th><th>Сура</th><th class="right">≈Стр.</th><th>Последнее повторение</th><th>Оценка</th><th class="right">Повторил</th></tr></thead><tbody>

function pageStateHtml(){ const q=state.quran, t=today(), mem=[...memPageSet()].sort((a,b)=>a-b);

/* ===================== 1.7: ИСТОРИЯ ЗАПИСЕЙ ===================== */
// Каждое действие, которое меняет счётчики дня (заучивание, повторение, чтение, книги, уроки, матны), попадает в журнал:
// {id, ts, date, key, n, label, mm?}. Запись можно изменить или удалить — итог дня поправится.
var JOURNAL_OFF=false;
function counterSnap(){ const o={}, put=(k,L)=>{ for(const d in L||{}) o[k+'|'+d]=L[d]; };
  put('hifz',state.log.hifz); put('rev',state.log.rev); put('khatm',state.khatm.log);
  for(const it of state.items) put('item:'+it.id,it.log); for(const x of state.texts){ put('text:'+x.id,x.log); put('trev:'+x.id,x.revLog); } return o; }
function memDiff(m0){ const out=[]; for(const S of SUR){ const a=m0[S.n]||'', b=state.quran.mem[S.n]||''; if(a===b) continue; let st=0;
  for(let i=1;i<=S.ayahs+1;i++){ const on=i<=S.ayahs&&b.charCodeAt(i-1)===49&&a.charCodeAt(i-1)!==49; if(on&&!st) st=i; if(!on&&st){ out.push([S.n,st,i-1]); st=0; } } } return out; }
// false — пользователь отказался от повторной записи
function journalize(c0,m0,label){ const c1=counterSnap(), diffs=[];
  for(const k of new Set([...Object.keys(c0),...Object.keys(c1)])){ const d=r3((c1[k]||0)-(c0[k]||0)); if(Math.abs(d)>1e-6){ const i=k.lastIndexOf('|'); diffs.push({key:k.slice(0,i),date:k.slice(i+1),n:d}); } }
  if(!diffs.length) return true; label=label||'Запись'; const now=Date.now();
  const dup=(state.journal||[]).find(e=>now-e.ts<60000&&e.label===label&&diffs.some(d=>d.key===e.key&&d.date===e.date&&Math.abs(d.n-e.n)<1e-6));
  if(dup&&!confirm(`Вы уже записали это ${Math.max(1,Math.round((now-dup.ts)/1000))} с назад:\n«${label}»\n\nЗаписать ещё раз?`)) return false;
  const mm=diffs.some(d=>d.key==='hifz')?memDiff(m0):null;
  for(const d of diffs) state.journal.push(Object.assign({id:'j'+now.toString(36)+Math.random().toString(36).slice(2,6),ts:now,date:d.date,key:d.key,n:d.n,label},d.key==='hifz'&&mm&&mm.length?{mm}:{}));
  return true; }
const findAny=id=>findItem(id)||findText(id);
function jrLog(key){ if(key==='hifz') return state.log.hifz; if(key==='rev') return state.log.rev; if(key==='khatm') return state.khatm.log;

function jrApply(key,date,delta){ const L=jrLog(key); if(!L) return; L[date]=r3((L[date]||0)+delta); if(Math.abs(L[date])<1e-6) delete L[date];

function jrUnit(key,n){ if(['hifz','rev','khatm'].includes(key)) return 'стр.'; const [t,id]=key.split(':'); if(t==='item'){ const it=findItem(id); return it?esc(it.unit):''; }
  const x=findText(id); return x?uW(t==='text'?x.mu:x.ru,Math.abs(n)):''; }
const JR_KIND={hifz:'Заучивание',rev:'Повторение',khatm:'Чтение Корана'};
function jrKind(key){ if(JR_KIND[key]) return JR_KIND[key]; const [t,id]=key.split(':'), o=t==='item'?findItem(id):findText(id); return (o?o.title:'')+(t==='trev'?' · повторение':''); }
UI.jrLim={};
// keys — какие счётчики показывать (null — все); выдвигается из полоски «История записей»
function historyFold(fid,keys,withKind){
  const all=keys||null, keyOk=k=>!all||all.includes(k), t=today();
  const byDay=new Map(); const add=(d,o)=>{ if(!byDay.has(d)) byDay.set(d,[]); byDay.get(d).push(o); };

  const keyList=all||(()=>{ const s=new Set(['hifz','rev','khatm']); state.items.forEach(i=>s.add('item:'+i.id)); state.texts.forEach(x=>{ s.add('text:'+x.id); s.add('trev:'+x.id); }); return [...s]; })();
  for(const k of keyList){ const L=jrLog(k)||{}; for(const d in L){ const sum=state.journal.filter(e=>e.key===k&&e.date===d).reduce((a,e)=>a+e.n,0), rest=r3(L[d]-sum); if(Math.abs(rest)>1e-6) add(d,{rest:{key:k,date:d,n:rest}}); } }
  const days=[...byDay.keys()].sort().reverse(), lim=UI.jrLim[fid]||14, shown=days.slice(0,lim);

var PDFV=null;
async function openPdfViewer(id,title,page){
  let blob; try{ blob=await IDB.get(id); }catch(e){} if(!blob) return toast('PDF не найден на этом устройстве — прикрепите его заново');
  toast('Открываю PDF…'); let lib, pdf; try{ lib=await loadPdfJs(); pdf=await lib.getDocument({data:await blob.arrayBuffer()}).promise; }catch(e){ return toast('Не удалось открыть PDF: '+e.message); }
  let saved=0; try{ saved=+localStorage.getItem('talib-pdfpage-'+id)||0; }catch(e){}
  page=Math.min(pdf.numPages,Math.max(1,saved>page?saved:page));
  const first=await pdf.getPage(1), vp=first.getViewport({scale:1}), ratio=vp.height/vp.width;
  const el=document.createElement('div'); el.className='pdfv'; el.innerHTML=`<div class="pdfv-bar"><button class="btn ghost icon" data-act="pdfv-close" title="Закрыть">‹</button><b class="pdfv-t">${esc(title)}</b><span class="pdfv-i" id="pdfvInfo"></span><button class="btn sm primary" data-act="pdfv-here" id="pdfvHere">Я здесь</button></div><div class="pdfv-body" id="pdfvBody">${Array.from({length:pdf.numPages},(_,i)=>`<div class="pdfv-pg" data-n="${i+1}" style="aspect-ratio:${(1/ratio).toFixed(4)}"></div>`).join('')}</div>`;
  document.body.appendChild(el); lockScroll(); const body=el.querySelector('#pdfvBody');
  PDFV={id,el,pdf,cur:page,rendered:new Map()};
  const render1=async n=>{ if(!PDFV||PDFV.rendered.has(n)) return; PDFV.rendered.set(n,null); const pg=await pdf.getPage(n), box=body.querySelector(`[data-n="${n}"]`); if(!box||!PDFV) return;
    const w=box.clientWidth||body.clientWidth, sc=w/pg.getViewport({scale:1}).width*Math.min(2,devicePixelRatio||1), v=pg.getViewport({scale:sc}), cv=document.createElement('canvas'); cv.width=v.width; cv.height=v.height;
    await pg.render({canvasContext:cv.getContext('2d'),viewport:v}).promise; if(!PDFV) return; box.innerHTML=''; box.appendChild(cv); PDFV.rendered.set(n,cv); };
  const io=new IntersectionObserver(es=>{ for(const e of es){ const n=+e.target.dataset.n; if(e.isIntersecting) render1(n); else if(PDFV&&PDFV.rendered.get(n)&&Math.abs(n-PDFV.cur)>4){ e.target.innerHTML=''; PDFV.rendered.delete(n); } } },{root:body,rootMargin:'800px 0px'});
  body.querySelectorAll('.pdfv-pg').forEach(b=>io.observe(b)); PDFV.io=io;
  const info=()=>{ const top=body.scrollTop+body.clientHeight*0.3; let n=1; for(const b of body.children){ if(b.offsetTop<=top) n=+b.dataset.n; else break; } PDFV.cur=n; el.querySelector('#pdfvInfo').textContent=`стр. ${n} / ${pdf.numPages}`; el.querySelector('#pdfvHere').textContent='Я здесь: '+n; };
  body.addEventListener('scroll',()=>{ if(PDFV) info(); },{passive:true});
  requestAnimationFrame(()=>{ const t=body.querySelector(`[data-n="${page}"]`); if(t) body.scrollTop=t.offsetTop; info(); }); }
function closePdfViewer(){ if(!PDFV) return; try{ localStorage.setItem('talib-pdfpage-'+PDFV.id,PDFV.cur); }catch(e){} try{ PDFV.io.disconnect(); PDFV.pdf.destroy(); }catch(e){} PDFV.el.remove(); PDFV=null; unlockScroll(); }

ДЕЙСТВИЯ: ты можешь предложить изменение в приложении. Если для действия не хватает данных (например: сколько страниц в книге, к какому сроку или по сколько в день, с какой даты начать), сначала задай короткие уточняющие вопросы. Когда всё ясно — кратко опиши, что будет сделано, и добавь в КОНЕЦ ответа ровно один блок:
\`\`\`talib-action
{"type":"add_item","kind":"book","title":"…","author":"…","total":300,"startDone":0,"start":"${t}","deadline":"","daily":10}

Виды действий:

- add_text — новый матн: {"type":"add_text","title":"…","author":"…","count":число,"unit":"hadith|page|line|item","goal":в день или 0,"deadline":""}.

- rev_add — повторение Корана: {"type":"rev_add","pages":число,"date":"ГГГГ-ММ-ДД"}.
Действие выполнится, только когда пользователь нажмёт кнопку подтверждения. Не пиши, что уже сделал. Даты — в формате ГГГГ-ММ-ДД; сегодня ${t}.

ОФОРМЛЕНИЕ: короткие абзацы и списки, **жирный** для главного, без таблиц. Арабский текст можно давать, но всегда с переводом.

    if((m=/^&gt;\s?(.*)$/.exec(l))){ out+=`<blockquote dir="auto">${inl(m[1])}</blockquote>`; continue; }
    out+=`<p dir="auto">${inl(l)}</p>`; }
  close(); return out; }
const AI_CITE=/аят|хадис|сура|сунн|пророк|посланник|ﷺ|передал|сказал|ибн |имам|саляф|сподвижник|[؀-ۿ]/i;

const AI_QUICK=[['Разбор успехов','Проанализируй мои данные за последние недели: что идёт хорошо, где я отстаю, и дай 3–5 конкретных советов.'],

function aiLogHtml(){ const ms=state.ui.ai.msgs;

    <div class="card"><div class="ai-kh"><h2>${ico('ai')}Ключ ${D.name}</h2><span class="ai-tag ${D.free?'free':''}">${D.price}</span></div>
      ${aiHowToHtml(p)}

function aiModelList(p){ return [...new Set([...AI_PROV[p].models,...((UI.aiLists||{})[p]||[])])]; }

    <label class="f"><span>Ключ API ${D.name}</span><div class="ai-keyrow"><input type="password" id="aiKey" placeholder="${key?'сохранён: ••••'+esc(key.slice(-4)):'вставьте ключ'}" autocomplete="off" autocapitalize="off" spellcheck="false" data-enter><button class="btn" data-act="ai-key" data-p="${p}">Сохранить</button></div></label>

    <label class="f"><span>Модель</span><div class="ai-keyrow"><input id="aiModel" list="aiML" data-chg="ai-model" data-p="${p}" value="${esc(model)}" placeholder="${D.def}" autocomplete="off" autocapitalize="off" spellcheck="false"><datalist id="aiML">${aiModelList(p).map(m=>`<option value="${esc(m)}">`).join('')}</datalist>${key?`<button class="btn sm" data-act="ai-models" data-p="${p}" title="Загрузить список моделей, доступных ключу">${ico('repeat')}</button>`:''}</div></label>

    ${D.lv?`<label class="f"><span>Уровень (насколько глубоко ИИ обдумывает ответ)</span><select data-chg="ai-level" data-p="${p}">${D.lv.map(([v,l])=>`<option value="${v}" ${aiLevel(p)===v?'selected':''}>${l}</option>`).join('')}</select></label>`
      :`<div class="sub" style="margin-top:10px">У DeepSeek уровень задаётся моделью: <b>deepseek-flash</b> — быстрая и дешёвая, <b>deepseek-v4-pro</b> — умнее и дороже.</div>`}
    <label class="ai-cb"><input type="checkbox" data-chg="ai-nonotes" ${P.noNotes?'checked':''}><span>Не отправлять ИИ задачи и заметки ежедневника</span></label>
    <div class="sub" style="margin-top:6px">Ключи хранятся в ваших данных и через вашу синхронизацию попадают на другие ваши устройства. Они есть и в файле резервной копии — не пересылайте его другим людям.</div>
    ${state.ui.ai.msgs.length?`<div class="row" style="margin-top:12px"><button class="btn sm" data-act="ai-clear">${ico('trash')}Очистить переписку на этом устройстве</button></div>`:''}`; }
function aiSettingsCard(){ return `<div class="card"><h2>${ico('ai')}ИИ-помощник</h2>${isOn('ai')?aiSettingsBody():'<div class="sub">Раздел спрятан — включите его в «Разделах в меню».</div>'}</div>`; }

async function aiSaveKey(p,btn){ const inp=$('#aiKey'), v=(inp&&inp.value||'').replace(/\s+/g,''), err=$('#aiErr'); if(err) err.textContent='';
  if(!v) return err?err.textContent='Вставьте ключ.':toast('Вставьте ключ'); if(v.length<20) return err?err.textContent='Ключ слишком короткий — скопируйте его полностью.':0;
  const P=aiP(), old=P.keys[p]; P.keys[p]=v; if(btn){ btn.disabled=true; btn.textContent='Проверяю…'; }
  let warn='';
  try{ const ids=await aiListModels(p); (UI.aiLists=UI.aiLists||{})[p]=ids; }
  catch(e){ if(/Ключ не подходит|Доступ запрещён|регионе/.test(e.message)){ P.keys[p]=old; if(btn){ btn.disabled=false; btn.textContent='Сохранить'; } if($('#aiErr')) $('#aiErr').textContent=e.message; else toast(e.message); return; } warn=e.message; }
  P.keys[p]=v; P.ok=1; save(); render(); toast(warn?'Ключ сохранён, но проверить его не удалось: '+warn:`Ключ ${AI_PROV[p].name} сохранён`); }
